name: Auto Renew Zampto

on:
  workflow_dispatch:
  schedule:
    - cron: '40 0 * * *'  # 每天 UTC 00:40 执行

permissions:
  actions: write
  contents: read

jobs:
  Renew-Zampto:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system deps (xvfb virtual display)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          pip install camoufox requests
          python -m camoufox fetch

      - name: Run Zampto renewal (Camoufox)
        env:
          COOKIE_JSON: ${{ secrets.COOKIE_JSON }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RENEW_THRESHOLD_HOURS: ${{ secrets.RENEW_THRESHOLD_HOURS }}
          FORCE_RENEW: ${{ secrets.FORCE_RENEW }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python3 -u app.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zampto-screenshots
          path: '*.png'
          if-no-files-found: ignore
