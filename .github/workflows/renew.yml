name: Auto Renew Zampto

on:
  workflow_dispatch:
  schedule:
    - cron: '40 0 * * *'  # 每天 UTC 00:40 执行

permissions:
  actions: write
  contents: read

jobs:
  Renew-Zampto:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests 'requests[socks]'
          python -m playwright install --with-deps chromium

      - name: Run Zampto renewal
        env:
          COOKIE_JSON: ${{ secrets.COOKIE_JSON }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          RENEW_THRESHOLD_HOURS: ${{ secrets.RENEW_THRESHOLD_HOURS }}
          FORCE_RENEW: ${{ secrets.FORCE_RENEW }}
        run: python3 app.py

      - name: Cleanup old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "Deleting run: $run_id"
              gh run delete $run_id || true
            fi
          done